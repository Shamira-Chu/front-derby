<svg width="600" height="500" viewBox="0 0 600 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skateBoot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="40%" stop-color="#581C87" />
      <stop offset="80%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <linearGradient id="goldGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#CA8A04" />
      <stop offset="100%" stop-color="#854D0E" />
    </linearGradient>

    <linearGradient id="wheelPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="50%" stop-color="#6B21A8" />
      <stop offset="100%" stop-color="#3B0764" />
    </linearGradient>

    <filter id="skateGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="20" flood-color="#A855F7" flood-opacity="0.35" />
    </filter>
  </defs>

  <g filter="url(#skateGlow)">
    <!-- Boot Body -->
    <path d="M100 220 C100 130 180 80 270 70 C370 60 480 140 530 200 C550 225 540 270 480 280 C360 290 180 290 120 280 C95 275 100 245 100 220 Z" fill="url(#skateBoot)" stroke="#A855F7" stroke-width="3" />

    <!-- Gold Ankle Strap -->
    <path d="M200 120 L290 100 C310 95 325 110 320 130 L300 160 C295 175 275 185 255 185 L180 180 Z" fill="url(#goldGold)" />
    <circle cx="280" cy="130" r="12" fill="#FEF08A" stroke="#854D0E" stroke-width="2" />

    <!-- Carbon Fiber Heel Counter -->
    <path d="M100 220 C100 260 120 280 160 280 C150 240 130 210 100 220 Z" fill="#18181B" stroke="#3F3F46" stroke-width="2" />

    <!-- Plate / Base Chassis -->
    <rect x="110" y="280" width="380" height="24" rx="6" fill="#1E293B" stroke="url(#goldGold)" stroke-width="3" />

    <!-- Gold Truck Mounts -->
    <rect x="140" y="304" width="60" height="30" rx="4" fill="url(#goldGold)" />
    <rect x="390" y="304" width="60" height="30" rx="4" fill="url(#goldGold)" />

    <!-- Toe Stop (Brake) -->
    <path d="M480 320 L530 310 L540 360 L490 370 Z" fill="#334155" stroke="#0F172A" stroke-width="3" rx="4" />

    <!-- Wheels (4 Quad Wheels) -->
    <!-- Rear Wheel Outer -->
    <circle cx="170" cy="390" r="55" fill="url(#wheelPurple)" stroke="#E9D5FF" stroke-width="4" />
    <circle cx="170" cy="390" r="30" fill="#1E1B4B" stroke="url(#goldGold)" stroke-width="3" />
    <circle cx="170" cy="390" r="10" fill="#FDE047" />

    <!-- Rear Wheel Inner Offset -->
    <circle cx="230" cy="405" r="48" fill="url(#wheelPurple)" opacity="0.8" />

    <!-- Front Wheel Outer -->
    <circle cx="420" cy="390" r="55" fill="url(#wheelPurple)" stroke="#E9D5FF" stroke-width="4" />
    <circle cx="420" cy="390" r="30" fill="#1E1B4B" stroke="url(#goldGold)" stroke-width="3" />
    <circle cx="420" cy="390" r="10" fill="#FDE047" />

    <!-- Front Wheel Inner Offset -->
    <circle cx="475" cy="405" r="48" fill="url(#wheelPurple)" opacity="0.8" />
  </g>
</svg>
