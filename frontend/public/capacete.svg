<svg width="600" height="600" viewBox="0 0 600 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Metallic Iridescent Gradient -->
    <linearGradient id="helmetBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="30%" stop-color="#1E1B4B" />
      <stop offset="65%" stop-color="#7E22CE" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <!-- Glowing Crystal Star Gradient -->
    <linearGradient id="starFacet1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F472B6" />
      <stop offset="50%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>
    <linearGradient id="starFacet2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E0E7FF" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <filter id="starGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="helmetShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="25" flood-color="#7E22CE" flood-opacity="0.4" />
    </filter>
  </defs>

  <g filter="url(#helmetShadow)">
    <!-- Helmet Main Shell Body -->
    <path d="M120 320 C110 180 230 70 380 80 C500 90 540 210 530 350 C520 420 480 470 420 480 C390 485 360 450 340 430 C270 430 200 450 150 420 C130 400 125 360 120 320 Z" fill="url(#helmetBody)" />

    <!-- Helmet Edge Trim / Padding -->
    <path d="M120 320 C125 360 130 400 150 420 C200 450 270 430 340 430 C360 450 390 485 420 480 C440 475 465 450 485 420" stroke="#1E1B4B" stroke-width="18" stroke-linecap="round" fill="none" />

    <!-- Ventilation Holes -->
    <ellipse cx="230" cy="140" rx="22" ry="10" transform="rotate(-20 230 140)" fill="#050611" />
    <ellipse cx="320" cy="120" rx="22" ry="10" transform="rotate(-5 320 120)" fill="#050611" />
    <ellipse cx="410" cy="135" rx="22" ry="10" transform="rotate(15 410 135)" fill="#050611" />
    <ellipse cx="160" cy="280" rx="12" ry="24" transform="rotate(10 160 280)" fill="#050611" />
    <ellipse cx="510" cy="360" rx="10" ry="22" transform="rotate(-10 510 360)" fill="#050611" />

    <!-- Large Crystalline Star Emblem -->
    <g filter="url(#starGlow)" transform="translate(20, -10)">
      <!-- Outer Star Polygon -->
      <polygon points="380,180 415,260 500,270 435,330 455,415 380,370 305,415 325,330 260,270 345,260" fill="url(#starFacet1)" stroke="#F472B6" stroke-width="4" />
      <!-- Star Facets Inner Lines -->
      <polygon points="380,180 380,300 415,260" fill="url(#starFacet2)" opacity="0.85" />
      <polygon points="500,270 380,300 435,330" fill="url(#starFacet2)" opacity="0.7" />
      <polygon points="455,415 380,300 380,370" fill="url(#starFacet2)" opacity="0.9" />
      <polygon points="305,415 380,300 325,330" fill="url(#starFacet2)" opacity="0.65" />
      <polygon points="260,270 380,300 345,260" fill="url(#starFacet2)" opacity="0.8" />
    </g>

    <!-- Straps & Buckle -->
    <path d="M220 400 L250 510 L310 510 L290 410" fill="#0F172A" stroke="#334155" stroke-width="2" />
    <path d="M410 440 L330 520 L270 520" fill="none" stroke="#0F172A" stroke-width="16" stroke-linecap="round" />
    <!-- Buckle Clip -->
    <rect x="280" y="500" width="30" height="24" rx="6" fill="#3B82F6" stroke="#93C5FD" stroke-width="2" />
  </g>
</svg>
