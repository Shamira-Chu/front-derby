<svg width="600" height="450" viewBox="0 0 600 450" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="whistleBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E056FD" />
      <stop offset="50%" stop-color="#6B21A8" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>

    <linearGradient id="ropeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="50%" stop-color="#4C1D95" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <filter id="whistleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#EC4899" flood-opacity="0.4" />
    </filter>
  </defs>

  <g filter="url(#whistleGlow)">
    <!-- Lanyard Rope Loop 1 -->
    <path d="M80 120 C180 40 380 60 480 180 C540 250 480 380 350 380 C220 380 80 320 80 220 C80 160 120 130 180 140" fill="none" stroke="url(#ropeGrad)" stroke-width="22" stroke-linecap="round" />

    <!-- Rope Knot Detail -->
    <path d="M320 310 C340 280 380 280 400 320 C410 340 380 370 340 350 C310 335 300 300 320 310 Z" fill="#381E72" stroke="#C084FC" stroke-width="4" />

    <!-- Whistle Main Body -->
    <!-- Air Mouthpiece Chamber -->
    <path d="M180 230 L320 180 L360 210 L350 280 L200 310 Z" fill="url(#whistleBody)" stroke="#F472B6" stroke-width="3" />
    <!-- Rear Sound Chamber Bulb -->
    <circle cx="370" cy="235" r="50" fill="url(#whistleBody)" stroke="#F472B6" stroke-width="3" />

    <!-- Lanyard Ring Connector -->
    <circle cx="420" cy="235" r="14" fill="none" stroke="#E2E8F0" stroke-width="6" />

    <!-- REF_14 Engraved Badge -->
    <rect x="230" y="215" width="60" height="26" rx="4" fill="#150D2A" stroke="#A855F7" stroke-width="2" />
    <text x="238" y="233" fill="#F472B6" font-family="monospace" font-size="12" font-weight="bold">REF_14</text>

    <!-- Air Hole Vent -->
    <rect x="290" y="195" width="22" height="12" rx="2" fill="#050611" />
  </g>
</svg>
